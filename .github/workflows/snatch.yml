name: oracle-snatch

# Public-repo mode (default): runs at :07 every hour (avoid the :00 rush,
# GitHub delays scheduled runs under load) and each run loops for ~50
# minutes, attempting every 5 minutes -> near-continuous coverage, and
# standard runners are free/unlimited on public repositories.
#
# Private-repo mode: change the cron to '*/30 * * * *' and RUN_MINUTES
# below to '0' (one attempt per run). That is ~48 runs/day x ~1 billed
# minute = ~1,440 min/month, inside the 2,000 free minutes of GitHub Free.
# Do NOT use the hourly+50min loop on a private repo (it would burn
# ~1,300 minutes per day).

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

concurrency:
  group: oracle-snatch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  snatch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
      OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
      OCI_IMAGE_ARM: ${{ secrets.OCI_IMAGE_ARM }}
      OCI_IMAGE_X86: ${{ secrets.OCI_IMAGE_X86 }}
      OCI_ADS: 'XVmt:AP-SINGAPORE-1-AD-1'
      RUN_MINUTES: '50'
      RETRY_SECONDS: '300'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install OCI SDK
        run: pip install -r requirements.txt

      - name: Write OCI config and keys from secrets
        run: |
          mkdir -p ~/.oci
          printf '%s' "$OCI_CONFIG_SECRET" > ~/.oci/config
          printf '%s' "$OCI_API_KEY_SECRET" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem
          printf '%s' "$OCI_SSH_PUBKEY_SECRET" > ~/oracle_sg.pub
        env:
          OCI_CONFIG_SECRET: ${{ secrets.OCI_CONFIG }}
          OCI_API_KEY_SECRET: ${{ secrets.OCI_API_KEY }}
          OCI_SSH_PUBKEY_SECRET: ${{ secrets.OCI_SSH_PUBKEY }}

      - name: Snatch attempt(s)
        id: snatch
        env:
          OCI_SSH_PUBKEY_FILE: ~/oracle_sg.pub
        run: |
          set -o pipefail
          python snatch_once.py 2>&1 | tee snatch_output.log

      - name: Open an issue if an instance was created
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '^SUCCESS ' snatch_output.log; then
            grep '^SUCCESS ' snatch_output.log > success_lines.txt
            gh issue create \
              --title 'Oracle instance snatched!' \
              --body "$(cat success_lines.txt)

          Check the OCI console for the instance state and public IP, then stop the Muse-side snatch services and this workflow if both instances now exist."
          fi

      # Email notification after EVERY run, snatched or not: each run
      # leaves one comment on a fixed status issue; the comment
      # @mentions the repo owner, and GitHub emails users about
      # mentions by default, so the owner gets one email per run.
      # (If no email ever arrives, check GitHub Settings ->
      # Notifications: email notifications for mentions must be on,
      # and the mail goes to the account's primary email address.)
      - name: Leave a status comment after every run (triggers email)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_TIME="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M %Z')"
          if grep -q '^SUCCESS ' snatch_output.log 2>/dev/null; then
            RESULT="抢到了: $(grep '^SUCCESS ' snatch_output.log | head -2)"
          elif grep -q 'ALREADY_EXISTS' snatch_output.log 2>/dev/null; then
            RESULT="实例已存在（可能此前已抢到）"
          elif [ "${{ steps.snatch.outcome }}" != "success" ]; then
            RESULT="运行出错（非容量错误），请看 Actions 运行日志"
          else
            RESULT="本轮没抢到（没容量），继续蹲"
          fi
          BODY=$(printf '@%s\n时间: %s\n结果: %s\n\n日志末尾:\n%s' "${{ github.repository_owner }}" "$RUN_TIME" "$RESULT" "$(tail -n 5 snatch_output.log 2>/dev/null)")
          ISSUE_NUM=$(gh issue list --search '蹲机状态通知 in:title' --json number --jq '.[0].number')
          if [ -z "$ISSUE_NUM" ] || [ "$ISSUE_NUM" = "null" ]; then
            gh issue create --title '蹲机状态通知' --body '每轮蹲机运行结束后会在这里留一条结果，GitHub 会据此向仓库主人发送邮件通知。' >/dev/null
            ISSUE_NUM=$(gh issue list --search '蹲机状态通知 in:title' --json number --jq '.[0].number')
          fi
          gh issue comment "$ISSUE_NUM" --body "$BODY"
