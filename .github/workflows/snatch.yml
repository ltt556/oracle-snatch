name: oracle-snatch

# Public-repo mode (default): runs at :07 every hour (avoid the :00 rush,
# GitHub delays scheduled runs under load) and each run loops for ~50
# minutes, attempting every 5 minutes -> near-continuous coverage, and
# standard runners are free/unlimited on public repositories.
#
# Private-repo mode: change the cron to '*/30 * * * *' and RUN_MINUTES
# below to '0' (one attempt per run). That is ~48 runs/day x ~1 billed
# minute = ~1,440 min/month, inside the 2,000 free minutes of GitHub Free.
# Do NOT use the hourly+50min loop on a private repo (it would burn
# ~1,300 minutes per day).

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

concurrency:
  group: oracle-snatch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  snatch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
      OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
      OCI_IMAGE_ARM: ${{ secrets.OCI_IMAGE_ARM }}
      OCI_IMAGE_X86: ${{ secrets.OCI_IMAGE_X86 }}
      OCI_ADS: 'XVmt:AP-SINGAPORE-1-AD-1'
      RUN_MINUTES: '50'
      RETRY_SECONDS: '300'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install OCI SDK
        run: pip install -r requirements.txt

      - name: Write OCI config and keys from secrets
        run: |
          mkdir -p ~/.oci
          printf '%s' "$OCI_CONFIG_SECRET" > ~/.oci/config
          printf '%s' "$OCI_API_KEY_SECRET" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem
          printf '%s' "$OCI_SSH_PUBKEY_SECRET" > ~/oracle_sg.pub
        env:
          OCI_CONFIG_SECRET: ${{ secrets.OCI_CONFIG }}
          OCI_API_KEY_SECRET: ${{ secrets.OCI_API_KEY }}
          OCI_SSH_PUBKEY_SECRET: ${{ secrets.OCI_SSH_PUBKEY }}

      - name: Snatch attempt(s)
        id: snatch
        env:
          OCI_SSH_PUBKEY_FILE: ~/oracle_sg.pub
        run: |
          set -o pipefail
          python snatch_once.py 2>&1 | tee snatch_output.log

      - name: Open an issue if an instance was created
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '^SUCCESS ' snatch_output.log; then
            grep '^SUCCESS ' snatch_output.log > success_lines.txt
            gh issue create \
              --title 'Oracle instance snatched!' \
              --body "$(cat success_lines.txt)

          Check the OCI console for the instance state and public IP, then stop the Muse-side snatch services and this workflow if both instances now exist."
          fi
