name: keepalive

# GitHub automatically disables scheduled workflows in a PUBLIC
# repository after 60 days without repository activity (scheduled runs
# themselves do not count). This monthly job commits a timestamp file,
# which counts as activity and keeps the snatch schedule alive.
# Not needed for private repositories, but harmless there too.

on:
  schedule:
    - cron: '23 5 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch heartbeat file
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .keepalive
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .keepalive
          git commit -m 'keepalive: monthly activity to keep scheduled workflows enabled'
          git push
